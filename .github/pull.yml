# Config for the Pull app (https://github.com/apps/pull).
#
# This fork intentionally carries local commits (see
# lib/routes/threads/utils.ts `crawlerHeaders`), so the default `hardreset`
# behaviour would silently discard them. Merge upstream in instead.
version: '1'
rules:
    - base: master
      upstream: DIYgod:master
      mergeMethod: merge
      mergeUnstable: true
